<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Canvas – 24 Grid Animations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px 20px 80px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: titlecase;
      color: rgba(255, 255, 255, 0.886);
      margin-bottom: 8px;
    }
    .intro {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.38);
      margin-bottom: 36px;
      max-width: 680px;
      line-height: 1.55;
      align-items: center;
    }
    .intro strong { color: rgba(255,255,255,0.7); font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 28px;
      max-width: 1120px;
    }
    .card {
      background: #000;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: hidden;
    }
    .card.rec {
      border-color: rgba(39, 201, 63, 0.45);
    }
    .card-label {
      padding: 14px 16px 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: titlecase;
      color: #0a0a0c;
      background: #27c93f;
      border-radius: 99px;
      padding: 2px 7px;
      font-weight: 700;
    }
    .card-desc {
      padding: 0 16px 12px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      line-height: 1.4;
    }
    .stage {
      position: relative;
      height: 280px;
      background: #000;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .fake-search {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: 72%;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.45);
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: auto;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>Canvas Animations</h1>
  <p class="intro">
    Grid animations for the Career landing canvas.<br>
    Grammar: <strong>dot = opening</strong>, <strong>gray line = possible path</strong>,
    <strong>white line = actual path</strong>
  </p>
  <div class="grid" id="board"></div>

  <script>
    const CELL = 24;
    const ITEMS = [
      { id: 1, title: 'Full grid pulse', desc: 'Every intersection pulses. Ambient field, no object.', rec: true },
      { id: 2, title: 'Emerging job dots (recycle)', desc: 'Market openings appear and vanish. Jobs language.', rec: true },
      { id: 3, title: 'Emerging dots, no recycle', desc: 'Roles appear and stay. Easy to read as Jobs.' },
      { id: 4, title: 'Dots then possible paths', desc: 'Openings first, then gray branches grow.' },
      { id: 5, title: 'Possible + actual path', desc: 'Two-layer Career hover language. Recommended idle.' },
      { id: 6, title: 'Actual path only', desc: 'One white line. Reads as fate, not choice.' },
      { id: 7, title: 'Equal tree from the left', desc: 'All branches same weight. Options dump.' },
      { id: 8, title: 'Stair / ladder', desc: 'Time across, rank up. Classic ladder.' },
      { id: 9, title: 'Forge off the rails', desc: 'Actual path sometimes leaves possible paths for a new dot.' },
      { id: 10, title: 'Reach, fade, restart', desc: 'Chapter loop. Pair with #5.' },
      { id: 11, title: '3D slice rotate', desc: 'X-Y fades as Z slices appear. Later, not first paint.' },
      { id: 12, title: 'Zoom into one node', desc: 'A role is picked. After click, not landing.' },
      { id: 13, title: 'Specialty clusters', desc: 'Seats group into platform / product / data.', rec: true },
      { id: 14, title: 'One node lit', desc: 'Fit rank. Neighbors dim. After filters.', rec: true },
      { id: 15, title: 'Green hire seat', desc: 'Available / hired beacon. Hire owns this.' },
      { id: 16, title: 'Drift / gravity dots', desc: 'Economy particles. Commerce, not Career.' },
      { id: 17, title: 'Sphere network', desc: 'Marketplace globe. Commerce already uses this.' },
      { id: 18, title: 'Heat / density', desc: 'Hot markets. Jobs demand map.', rec: true },
      { id: 19, title: 'Cursor well ripple', desc: 'Hire playground. Move the pointer.', rec: true },
      { id: 20, title: 'Static grid', desc: 'No motion. Quiet document fallback.' },
      { id: 21, title: 'Draw in once, then still', desc: 'Arrival, then hold.' },
      { id: 22, title: 'Specialty lanes', desc: 'Horizontal tracks inside software.' },
      { id: 23, title: 'Industry bands + crossing path', desc: 'Same role moving across markets.' },
      { id: 24, title: 'Idle path, pause on focus', desc: 'Hover the search chip to freeze the path.' }
    ];

    const board = document.getElementById('board');
    ITEMS.forEach((item) => {
      const card = document.createElement('article');
      card.className = 'card' + (item.rec ? ' rec' : '');
      card.innerHTML =
        '<div class="card-label">' + item.id + '. ' + item.title +
        (item.rec ? '<span class="badge">Recommended</span>' : '') + '</div>' +
        '<p class="card-desc">' + item.desc + '</p>' +
        '<div class="stage" data-anim="' + item.id + '">' +
          '<canvas></canvas>' +
          (item.id === 24 ? '<div class="fake-search">Search Roles</div>' : '') +
        '</div>';
      board.appendChild(card);
    });

    function setup(canvas) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cols = Math.max(4, Math.floor(w / CELL));
      const rows = Math.max(4, Math.floor(h / CELL));
      const ox = (w - cols * CELL) / 2;
      const oy = (h - rows * CELL) / 2;
      return { ctx, w, h, cols, rows, ox, oy };
    }

    function xy(g, c, r) {
      return { x: g.ox + c * CELL, y: g.oy + r * CELL };
    }

    function drawGrid(g, a) {
      const { ctx, cols, rows, ox, oy } = g;
      ctx.strokeStyle = 'rgba(255,255,255,' + (a == null ? 0.08 : a) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let c = 0; c <= cols; c++) {
        const x = ox + c * CELL;
        ctx.moveTo(x + 0.5, oy);
        ctx.lineTo(x + 0.5, oy + rows * CELL);
      }
      for (let r = 0; r <= rows; r++) {
        const y = oy + r * CELL;
        ctx.moveTo(ox, y + 0.5);
        ctx.lineTo(ox + cols * CELL, y + 0.5);
      }
      ctx.stroke();
    }

    function dot(ctx, x, y, r, fill) {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function linePts(ctx, pts, color, width, alpha) {
      if (pts.length < 2) return;
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha == null ? 1 : alpha;
      ctx.lineWidth = width;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function rand(n) { return Math.floor(Math.random() * n); }

    function orthoPath(g, len, startC, startR) {
      let c = startC == null ? 0 : startC;
      let r = startR == null ? Math.floor(g.rows / 2) : startR;
      const pts = [xy(g, c, r)];
      let vert = 0;
      while (c < g.cols && pts.length < len) {
        const choices = ['R'];
        if (vert < 2 && r > 1) choices.push('U');
        if (vert < 2 && r < g.rows - 1) choices.push('D');
        const dir = choices[rand(choices.length)];
        if (dir === 'R') { c += 1; vert = 0; }
        else if (dir === 'U') { r -= 1; vert += 1; }
        else { r += 1; vert += 1; }
        c = Math.max(0, Math.min(g.cols, c));
        r = Math.max(0, Math.min(g.rows, r));
        pts.push(xy(g, c, r));
      }
      return pts;
    }

    function branchTree(g) {
      const startR = Math.floor(g.rows / 2);
      const branches = [];
      function grow(c, r, depth) {
        const pts = [xy(g, c, r)];
        let vert = 0;
        let cc = c, rr = r;
        const steps = 3 + rand(3);
        for (let i = 0; i < steps && cc < g.cols; i++) {
          const goR = vert >= 2 || Math.random() < 0.55;
          if (goR) { cc += 1; vert = 0; }
          else if (rr > 1 && Math.random() < 0.5) { rr -= 1; vert += 1; }
          else if (rr < g.rows - 1) { rr += 1; vert += 1; }
          else { cc += 1; vert = 0; }
          pts.push(xy(g, cc, rr));
        }
        branches.push(pts);
        if (depth < 3 && cc < g.cols - 1) {
          grow(cc, Math.max(0, rr - 2), depth + 1);
          grow(cc, Math.min(g.rows, rr + 2), depth + 1);
        }
      }
      grow(0, startR, 0);
      return branches;
    }

    function stairs(g) {
      const pts = [];
      let c = 0, r = g.rows - 1;
      pts.push(xy(g, c, r));
      while (c < g.cols && r > 0) {
        c = Math.min(g.cols, c + 2);
        pts.push(xy(g, c, r));
        r = Math.max(0, r - 1);
        pts.push(xy(g, c, r));
      }
      return pts;
    }

    const runners = [];

    document.querySelectorAll('.stage').forEach((stage) => {
      const id = Number(stage.dataset.anim);
      const canvas = stage.querySelector('canvas');
      let g = setup(canvas);
      const state = { t: 0, id, stage, canvas, paused: false };

      if (id === 2 || id === 3) {
        state.dots = [];
      }
      if (id === 4 || id === 5 || id === 9 || id === 10 || id === 24) {
        state.possible = [orthoPath(g, 18, 0, Math.floor(g.rows / 2))];
        state.possible.push(orthoPath(g, 14, 4, Math.max(1, Math.floor(g.rows / 2) - 2)));
        state.possible.push(orthoPath(g, 14, 4, Math.min(g.rows - 1, Math.floor(g.rows / 2) + 2)));
        state.actual = orthoPath(g, 22, 0, Math.floor(g.rows / 2));
        state.progress = 0;
        state.fade = 0;
        state.phase = 'draw';
      }
      if (id === 6) {
        state.actual = orthoPath(g, 22, 0, Math.floor(g.rows / 2));
        state.progress = 0;
      }
      if (id === 7) state.tree = branchTree(g);
      if (id === 8) state.stairs = stairs(g);
      if (id === 11) state.ang = 0;
      if (id === 12) { state.zoom = 1; state.dir = 1; }
      if (id === 13) {
        const colors = ['#7dd3fc', '#86efac', '#f9a8d4'];
        state.groups = colors.map((col, i) => {
          const dots = [];
          const cx = 3 + i * Math.floor(g.cols / 3);
          for (let n = 0; n < 8; n++) {
            dots.push({
              c: Math.max(1, Math.min(g.cols - 1, cx + rand(4) - 1)),
              r: 2 + rand(g.rows - 3),
              col
            });
          }
          return dots;
        });
      }
      if (id === 15) {
        state.seat = { c: Math.floor(g.cols * 0.62), r: Math.floor(g.rows * 0.45) };
      }
      if (id === 16) {
        state.bits = Array.from({ length: 28 }, () => ({
          x: Math.random() * g.w,
          y: Math.random() * g.h,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4
        }));
      }
      if (id === 17) {
        const nodes = [];
        for (let i = 0; i < 22; i++) {
          const th = Math.random() * Math.PI * 2;
          const ph = Math.acos(2 * Math.random() - 1);
          nodes.push({ th, ph, r: 0.92 });
        }
        state.nodes = nodes;
        state.spin = 0;
      }
      if (id === 18) {
        state.heat = [];
        for (let i = 0; i < 5; i++) {
          state.heat.push({
            c: 2 + rand(g.cols - 3),
            r: 2 + rand(g.rows - 3),
            s: 40 + rand(50)
          });
        }
      }
      if (id === 19) {
        state.mouse = { x: g.w / 2, y: g.h / 2 };
        stage.addEventListener('pointermove', (e) => {
          const b = canvas.getBoundingClientRect();
          state.mouse.x = e.clientX - b.left;
          state.mouse.y = e.clientY - b.top;
        });
      }
      if (id === 21) state.drawn = 0;
      if (id === 24) {
        const chip = stage.querySelector('.fake-search');
        chip.addEventListener('pointerenter', () => { state.paused = true; });
        chip.addEventListener('pointerleave', () => { state.paused = false; });
      }

      state.g = g;
      runners.push(state);
    });

    window.addEventListener('resize', () => {
      runners.forEach((s) => { s.g = setup(s.canvas); });
    });

    function sliceVisible(pts, t) {
      const n = Math.max(0, Math.min(pts.length, t));
      const i = Math.floor(n);
      const f = n - i;
      if (i <= 0) return pts.slice(0, 1);
      const out = pts.slice(0, i);
      if (i < pts.length) {
        out.push({
          x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * f,
          y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * f
        });
      }
      return out;
    }

    function tick(now) {
      runners.forEach((s) => {
        const g = s.g;
        const ctx = g.ctx;
        ctx.clearRect(0, 0, g.w, g.h);
        const id = s.id;
        s.t += s.paused ? 0 : 1;

        if (id !== 17 && id !== 11) drawGrid(g, id === 20 ? 0.14 : 0.08);

        if (id === 1) {
          const pulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.t * 0.04));
          for (let c = 0; c <= g.cols; c++) {
            for (let r = 0; r <= g.rows; r++) {
              const p = xy(g, c, r);
              dot(ctx, p.x, p.y, 1.6, 'rgba(200,200,200,' + (0.15 * pulse) + ')');
            }
          }
        }

        if (id === 2 || id === 3) {
          if (s.t % 18 === 0 && s.dots.length < 30) {
            s.dots.push({
              c: rand(g.cols + 1),
              r: rand(g.rows + 1),
              age: 0,
              life: id === 2 ? 220 + rand(80) : 9999
            });
          }
          if (id === 2 && s.dots.length >= 30 && s.t % 26 === 0) {
            s.dots.shift();
            s.dots.push({ c: rand(g.cols + 1), r: rand(g.rows + 1), age: 0, life: 240 });
          }
          s.dots.forEach((d) => {
            d.age += 1;
            const p = xy(g, d.c, d.r);
            const born = Math.min(1, d.age / 16);
            const dying = d.age > d.life - 20 ? (d.life - d.age) / 20 : 1;
            const a = Math.max(0, born * dying);
            const sc = 1 + 0.45 * Math.sin(d.age * 0.08);
            dot(ctx, p.x, p.y, 2.2 * sc, 'rgba(220,220,220,' + (0.75 * a) + ')');
          });
        }

        if (id === 4) {
          const startLines = 90;
          if (s.t % 22 === 0 && s.dotsNeed == null) s.dotsNeed = [];
          if (!s.seeds) {
            s.seeds = Array.from({ length: 10 }, () => ({
              c: rand(g.cols + 1), r: rand(g.rows + 1), age: rand(40)
            }));
          }
          s.seeds.forEach((d) => {
            d.age += 1;
            const p = xy(g, d.c, d.r);
            const sc = 1 + 0.4 * Math.sin(d.age * 0.07);
            dot(ctx, p.x, p.y, 2.1 * sc, 'rgba(210,210,210,0.7)');
          });
          if (s.t > startLines) {
            const u = (s.t - startLines) * 0.04;
            s.possible.forEach((path, i) => {
              linePts(ctx, sliceVisible(path, u - i * 2), 'rgba(160,160,160,0.7)', 1.4);
            });
          }
        }

        if (id === 5 || id === 9 || id === 10 || id === 24) {
          if (!s.paused) s.progress += 0.035;
          const fadeStart = id === 10 || id === 5 || id === 24;
          s.possible.forEach((path) => {
            linePts(ctx, sliceVisible(path, s.progress * 0.85), 'rgba(140,140,140,0.55)', 1.25);
          });
          const actualPts = id === 9 && s.t > 180
            ? s.actual.concat([xy(g, g.cols - 2, 1)])
            : s.actual;
          const shown = sliceVisible(actualPts, Math.max(0, s.progress - 8));
          const alpha = s.phase === 'fade' ? Math.max(0, 1 - s.fade) : 1;
          linePts(ctx, shown, 'rgba(255,255,255,0.92)', 2.1, alpha);
          if (shown.length) {
            const tip = shown[shown.length - 1];
            dot(ctx, tip.x, tip.y, 2.4, 'rgba(255,255,255,' + alpha + ')');
          }
          if (fadeStart && s.progress > actualPts.length + 6) {
            s.phase = 'fade';
            s.fade += 0.012;
            if (s.fade >= 1) {
              s.progress = 0;
              s.fade = 0;
              s.phase = 'draw';
              s.actual = orthoPath(g, 22, 0, Math.floor(g.rows / 2));
            }
          }
        }

        if (id === 6) {
          s.progress += 0.05;
          linePts(ctx, sliceVisible(s.actual, s.progress), '#fff', 2.2);
          if (s.progress > s.actual.length + 8) s.progress = 0;
        }

        if (id === 7) {
          const u = (s.t % 400) * 0.06;
          s.tree.forEach((path, i) => {
            linePts(ctx, sliceVisible(path, u - i), 'rgba(220,220,220,0.7)', 1.4);
          });
        }

        if (id === 8) {
          const u = (s.t % 280) * 0.05;
          linePts(ctx, sliceVisible(s.stairs, u), '#fff', 2);
        }

        if (id === 11) {
          s.ang += 0.008;
          const cx = g.w / 2, cy = g.h / 2;
          for (let i = 0; i < 6; i++) {
            const z = i / 6;
            const sc = 0.55 + z * 0.5;
            const off = Math.sin(s.ang + i * 0.4) * 18;
            ctx.save();
            ctx.translate(cx + off, cy - i * 10);
            ctx.scale(sc, sc * (0.35 + 0.2 * Math.cos(s.ang)));
            ctx.translate(-g.w / 2, -g.h / 2);
            ctx.globalAlpha = 0.15 + z * 0.2;
            drawGrid(g, 0.35);
            ctx.restore();
          }
          const path = s._p || (s._p = orthoPath(g, 16, 1, Math.floor(g.rows / 2)));
          linePts(ctx, sliceVisible(path, (s.t % 200) * 0.08), '#fff', 2);
        }

        if (id === 12) {
          s.zoom += s.dir * 0.004;
          if (s.zoom > 2.2) s.dir = -1;
          if (s.zoom < 1) s.dir = 1;
          const focus = xy(g, Math.floor(g.cols / 2), Math.floor(g.rows / 2));
          ctx.save();
          ctx.translate(g.w / 2, g.h / 2);
          ctx.scale(s.zoom, s.zoom);
          ctx.translate(-focus.x, -focus.y);
          drawGrid(g, 0.14);
          for (let c = 0; c <= g.cols; c++) {
            for (let r = 0; r <= g.rows; r++) {
              const p = xy(g, c, r);
              dot(ctx, p.x, p.y, 1.7, 'rgba(210,210,210,0.45)');
            }
          }
          dot(ctx, focus.x, focus.y, 3.4, '#fff');
          ctx.restore();
        }

        if (id === 13) {
          s.groups.forEach((group) => {
            group.forEach((d) => {
              const p = xy(g, d.c, d.r);
              dot(ctx, p.x, p.y, 3.1, d.col);
            });
          });
        }

        if (id === 14) {
          const pick = { c: Math.floor(g.cols / 2), r: Math.floor(g.rows / 2) };
          for (let c = 0; c <= g.cols; c++) {
            for (let r = 0; r <= g.rows; r++) {
              const dist = Math.abs(c - pick.c) + Math.abs(r - pick.r);
              const a = dist === 0 ? 1 : Math.max(0.05, 0.45 - dist * 0.06);
              const p = xy(g, c, r);
              dot(ctx, p.x, p.y, dist === 0 ? 3.4 : 1.6, 'rgba(255,255,255,' + a + ')');
            }
          }
        }

        if (id === 15) {
          for (let c = 0; c <= g.cols; c++) {
            for (let r = 0; r <= g.rows; r++) {
              const p = xy(g, c, r);
              dot(ctx, p.x, p.y, 1.4, 'rgba(180,180,180,0.2)');
            }
          }
          const p = xy(g, s.seat.c, s.seat.r);
          const k = 0.5 + 0.5 * Math.sin(s.t * 0.08);
          ctx.strokeStyle = 'rgba(39,201,63,' + (0.35 + 0.35 * (1 - k)) + ')';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 6 + k * 10, 0, Math.PI * 2);
          ctx.stroke();
          dot(ctx, p.x, p.y, 3.2, '#27c93f');
        }

        if (id === 16) {
          const cx = g.w / 2, cy = g.h / 2;
          s.bits.forEach((b) => {
            b.vx += (cx - b.x) * 0.00015;
            b.vy += (cy - b.y) * 0.00015;
            b.x += b.vx; b.y += b.vy;
            dot(ctx, b.x, b.y, 1.8, 'rgba(253,186,116,0.8)');
          });
        }

        if (id === 17) {
          s.spin += 0.008;
          const cx = g.w / 2, cy = g.h / 2, R = Math.min(g.w, g.h) * 0.32;
          const proj = (n) => {
            const x = R * Math.sin(n.ph) * Math.cos(n.th + s.spin);
            const y = R * Math.cos(n.ph);
            const z = R * Math.sin(n.ph) * Math.sin(n.th + s.spin);
            return { x: cx + x, y: cy + y, z };
          };
          const pts = s.nodes.map(proj);
          ctx.strokeStyle = 'rgba(253,186,116,0.22)';
          ctx.lineWidth = 1;
          for (let i = 0; i < pts.length; i++) {
            for (let j = i + 1; j < pts.length; j++) {
              const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
              if (dx * dx + dy * dy < 70 * 70) {
                ctx.beginPath();
                ctx.moveTo(pts[i].x, pts[i].y);
                ctx.lineTo(pts[j].x, pts[j].y);
                ctx.stroke();
              }
            }
          }
          pts.forEach((p) => dot(ctx, p.x, p.y, 2.2, 'rgba(255,220,180,0.9)'));
        }

        if (id === 18) {
          s.heat.forEach((h) => {
            const p = xy(g, h.c, h.r);
            const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, h.s);
            grd.addColorStop(0, 'rgba(248,113,113,0.28)');
            grd.addColorStop(1, 'rgba(248,113,113,0)');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(p.x, p.y, h.s, 0, Math.PI * 2);
            ctx.fill();
          });
          for (let c = 0; c <= g.cols; c++) {
            for (let r = 0; r <= g.rows; r++) {
              const p = xy(g, c, r);
              dot(ctx, p.x, p.y, 1.3, 'rgba(200,200,200,0.25)');
            }
          }
        }

        if (id === 19) {
          const mx = s.mouse.x, my = s.mouse.y;
          for (let c = 0; c <= g.cols; c++) {
            for (let r = 0; r <= g.rows; r++) {
              const p = xy(g, c, r);
              const dx = p.x - mx, dy = p.y - my;
              const d = Math.sqrt(dx * dx + dy * dy) || 1;
              const push = Math.max(0, 48 - d) / 48;
              const x = p.x + (dx / d) * push * 10;
              const y = p.y + (dy / d) * push * 10;
              dot(ctx, x, y, 1.5, 'rgba(200,200,200,0.45)');
            }
          }
        }

        if (id === 20) {
          for (let c = 0; c <= g.cols; c++) {
            for (let r = 0; r <= g.rows; r++) {
              const p = xy(g, c, r);
              dot(ctx, p.x, p.y, 1.5, 'rgba(180,180,180,0.28)');
            }
          }
        }

        if (id === 21) {
          s.drawn = Math.min(1, s.drawn + 0.006);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, g.w * s.drawn, g.h);
          ctx.clip();
          for (let c = 0; c <= g.cols; c++) {
            for (let r = 0; r <= g.rows; r++) {
              const p = xy(g, c, r);
              dot(ctx, p.x, p.y, 1.5, 'rgba(200,200,200,0.35)');
            }
          }
          ctx.restore();
        }

        if (id === 22) {
          const lanes = 3;
          const colors = ['rgba(125,211,252,0.35)', 'rgba(134,239,172,0.35)', 'rgba(249,168,212,0.35)'];
          for (let i = 0; i < lanes; i++) {
            const y0 = g.oy + Math.floor((i + 0.35) * g.rows / lanes) * CELL;
            ctx.fillStyle = colors[i];
            ctx.fillRect(g.ox, y0, g.cols * CELL, CELL * 2);
          }
          const u = (s.t % 240) * 0.05;
          const path = s._lane || (s._lane = (() => {
            const pts = [];
            let c = 0, r = Math.floor(g.rows * 0.2);
            pts.push(xy(g, c, r));
            while (c < g.cols) {
              c += 2;
              if (c === 6) r = Math.floor(g.rows * 0.55);
              if (c === 12) r = Math.floor(g.rows * 0.8);
              pts.push(xy(g, Math.min(g.cols, c), r));
            }
            return pts;
          })());
          linePts(ctx, sliceVisible(path, u), '#fff', 2);
        }

        if (id === 23) {
          const bands = ['#1e293b', '#111827', '#1e1b4b'];
          const w = g.cols * CELL / 3;
          bands.forEach((col, i) => {
            ctx.fillStyle = col;
            ctx.globalAlpha = 0.45;
            ctx.fillRect(g.ox + i * w, g.oy, w, g.rows * CELL);
            ctx.globalAlpha = 1;
          });
          drawGrid(g, 0.08);
          const path = s._cross || (s._cross = (() => {
            const pts = [];
            let c = 0, r = Math.floor(g.rows / 2);
            pts.push(xy(g, c, r));
            while (c < g.cols) {
              c += 1;
              if (c % 5 === 0) r = Math.max(1, Math.min(g.rows - 1, r + (Math.random() < 0.5 ? -1 : 1)));
              pts.push(xy(g, c, r));
            }
            return pts;
          })());
          linePts(ctx, sliceVisible(path, (s.t % 260) * 0.05), '#fff', 2);
        }

        if (id === 24 && s.paused) {
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.fillRect(0, 0, g.w, g.h);
        }
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
